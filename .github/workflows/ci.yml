name: CI

on:
  push:
    branches: [main, agentic-cli]
  pull_request:
    branches: [main, agentic-cli]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Rust version
        id: rust-version
        run: echo "version=$(rustc --version)" >> "$GITHUB_OUTPUT"

      # Disabled to avoid running out of disk during large workspace builds.
      # - name: Cache cargo registry
      #   uses: actions/cache@v4
      #   with:
      #     path: |
      #       ~/.cargo/registry
      #       ~/.cargo/git
      #       target
      #     key: ${{ runner.os }}-cargo-${{ steps.rust-version.outputs.version }}-${{ hashFiles('**/Cargo.lock') }}
      #     restore-keys: |
      #       ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose

  fmt:
    name: Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Ensure rustfmt is available
        run: rustup component add rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check
